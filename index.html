<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>Infynex Global IT Solutions | IT & HR Solutions</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Infynex Global IT Solutions provides IT recruitment, non-IT recruitment, staffing, HR outsourcing, executive hiring, and technology solutions."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="Infynex Global IT Solutions, IT recruitment, non-IT recruitment, staffing, HR outsourcing, executive hiring, IT solutions"
    />

    <meta
      name="author"
      content="Infynex Global IT Solutions"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://infynexit.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/icon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Infynex Global IT Solutions"
    />

    <meta
      property="og:description"
      content="IT recruitment, staffing, HR solutions, and technology services."
    />

    <meta
      property="og:url"
      content="https://infynexit.com/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Infynex Global IT Solutions"
    />

    <!-- Open Graph Image -->
    <meta
      property="og:image"
      content="https://infynexit.com/logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
